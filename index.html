  { q: "В каком году был опубликован роман?", a: "1836 год." },
  { q: "К какому жанру относится произведение?", a: "Историческая повесть; её также часто называют историческим романом." },
  { q: "Сколько глав в романе?", a: "14 глав." },
  { q: "Какая пословица стала эпиграфом ко всему роману?", a: "«Береги честь смолоду»." },
  { q: "Кто из героев произносит пословицу «Береги платье снову, а честь смолоду»?", a: "Эпиграф к произведению звучит так: «Береги честь смолоду». Андрей Петрович наставляет сына беречь честь." },
  { q: "Какова главная тема романа?", a: "Честь, долг, любовь, пугачёвское восстание." },
  { q: "Что означает название «Капитанская дочка»?", a: "Главная героиня — Маша, дочь капитана Миронова." },
  { q: "Кто такая капитанская дочка?", a: "Марья Ивановна Миронова." }
];

let i = 0;
let shown = false;

const counterEl  = document.getElementById("counter");
const questionEl = document.getElementById("question");
const answerEl   = document.getElementById("answer");
const prevBtn    = document.getElementById("prev");
const nextBtn    = document.getElementById("next");
const showBtn    = document.getElementById("show");

function render() {
  counterEl.textContent  = "Вопрос " + (i + 1) + " из " + questions.length;
  questionEl.textContent = questions[i].q;
  answerEl.textContent   = questions[i].a;
  answerEl.className     = shown ? "answer show" : "answer";
  showBtn.textContent    = shown ? "Скрыть ответ" : "Показать ответ";
  prevBtn.disabled       = i === 0;
  nextBtn.disabled       = i === questions.length - 1;
}

showBtn.onclick = () => { shown = !shown; render(); };
nextBtn.onclick = () => { if (i < questions.length - 1) { i++; shown = false; render(); } };
prevBtn.onclick = () => { if (i > 0) { i--; shown = false; render(); } };

render();
</script>
</body>
